<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {

	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

	}

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}
.leaflet-container a {

}

	filter: inherit;

	}

	}

	-moz-box-sizing: border-box;

	}

	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	}
.leaflet-top {
	top: 0;

.leaflet-right {
	right: 0;

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {

.leaflet-right .leaflet-control {
	margin-right: 10px;

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

/* attribution and scale controls */

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

.leaflet-popup-tip-container {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {

	padding: 6px;

.leaflet-tooltip-right:before {

	border: 6px solid transparent;

	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
:root{
  --pelepah:#1F3D2B; --pelepah-2:#2E5A3F; --daun:#3F7D4E; --tanah:#8A5A3B;
  --latar:#E9EEE8; --muka:#FFFFFF; --muka-2:#F5F8F4; --garis:#CBD5CC; --tinta:#17231B; --tinta-2:#4B5A50;
  --patok:#F2C230; --patok-tinta:#111; --bahaya:#B42318; --waspada:#C2620A; --info:#1D5FA8; --kons:#0F766E;
  --p1:#B42318; --p2:#E07B12; --p3:#C9A00C; --p4:#3F7D4E; --pkons:#0F766E; --pnull:#8B958E;
  --r:10px; --bayang:0 1px 2px rgba(23,35,27,.08),0 6px 18px rgba(23,35,27,.06);
  --fon:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
[data-tema="gelap"]{
  --latar:#0F1712; --muka:#17231B; --muka-2:#1D2B22; --garis:#2D3E33; --tinta:#E6EDE7; --tinta-2:#A7B5AB; --pelepah:#0B1510; --pelepah-2:#223A2B; --info:#6AA7EE;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--tinta);font-family:var(--fon);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.angka,td.n,.kpi b{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--patok);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kepala */
#kepala{background:var(--pelepah);color:#fff;position:sticky;top:0;z-index:900;padding-top:env(safe-area-inset-top)}
.kepala-dalam{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1280px;margin:0 auto}
.merek{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.merek .ikon{width:36px;height:36px;border-radius:8px;background:var(--pelepah-2);display:grid;place-items:center;font-size:20px;flex:none;overflow:hidden}
.merek .ikon img{width:100%;height:100%;object-fit:cover}
.merek h1{font-size:17px;margin:0;font-weight:750;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.merek small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lencana{font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;font-weight:600}
.tbl-kepala{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;min-width:38px;height:38px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbl-kepala:hover{background:rgba(255,255,255,.1)}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--patok);color:#111;display:grid;place-items:center;font-weight:800;border:2px solid rgba(255,255,255,.5);cursor:pointer;flex:none;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
#saringan{display:flex;gap:6px;padding:0 12px 8px;max-width:1280px;margin:0 auto;overflow-x:auto}
#saringan select{background:var(--pelepah-2);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 8px;min-width:140px;max-width:220px}
#nav{display:flex;gap:2px;overflow-x:auto;background:var(--pelepah-2);padding:0 8px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{background:none;border:0;color:#DDE8DF;padding:11px 13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
#nav button[aria-current="page"]{color:#fff;border-bottom-color:var(--patok)}
#spanduk:empty{display:none}
.spanduk{padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.spanduk.bahaya{background:#FDECEA;color:#7A1A12}
.spanduk.waspada{background:#FFF4E0;color:#6B3A05}
.spanduk.info{background:#E6F0FA;color:#113A66}
.spanduk button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:2px 8px;cursor:pointer}

main{max-width:1280px;margin:0 auto;padding:12px}
.kartu{background:var(--muka);border:1px solid var(--garis);border-radius:var(--r);padding:14px;margin-bottom:12px}
.kartu h2{font-size:17px;margin:0 0 8px}
.kartu h3{font-size:15px;margin:12px 0 6px}
.redup{color:var(--tinta-2)}
.kecil{font-size:13px}
.baris{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.baris.antara{justify-content:space-between}
.kisi{display:grid;gap:12px}
.kisi-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kisi-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--muka);border:1px solid var(--garis);border-radius:var(--r);padding:10px 12px}
.kpi span{display:block;font-size:12.5px;color:var(--tinta-2)}
.kpi b{font-size:22px;display:block;line-height:1.2}
.kpi i{font-style:normal;font-size:12px;color:var(--tinta-2)}

/* Patok blok: papan nama blok kuning bercat stensil */
.patok{display:inline-block;background:var(--patok);color:var(--patok-tinta);font-weight:900;letter-spacing:.06em;padding:1px 7px;border-radius:3px;border:1.5px solid #111;font-size:13px;line-height:1.35;white-space:nowrap;cursor:pointer}
.patok.besar{font-size:24px;padding:2px 12px;border-width:2px}
.prio{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:0 6px;font-weight:800;font-size:12.5px;color:#fff}
.prio.P1{background:var(--p1)}.prio.P2{background:var(--p2)}.prio.P3{background:var(--p3);color:#111}.prio.P4{background:var(--p4)}.prio.KONS{background:var(--pkons)}.prio.\-{background:var(--pnull)}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;border:1px solid var(--garis);background:var(--muka-2);white-space:nowrap}
.tag.TERTUNDA{background:#FFF4E0;border-color:#F3C98B;color:#6B3A05}.tag.DISETUJUI{background:#E5F3E8;border-color:#9FCDA9;color:#1E4D2B}.tag.DITOLAK{background:#FDECEA;border-color:#EFA9A2;color:#7A1A12}
[data-tema="gelap"] .tag.TERTUNDA,[data-tema="gelap"] .tag.DISETUJUI,[data-tema="gelap"] .tag.DITOLAK{color:#111}

.tbl{border:1px solid var(--garis);background:var(--muka);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.tbl:hover{background:var(--muka-2)}
.tbl.utama{background:var(--pelepah-2);border-color:var(--pelepah-2);color:#fff;font-weight:650}
.tbl.utama:hover{background:var(--pelepah)}
.tbl.bahaya{color:var(--bahaya);border-color:#E7B0AA}
.tbl.kecil{min-height:32px;padding:4px 9px;font-size:13.5px}
.tbl:disabled{opacity:.5;cursor:not-allowed}
.tbl-teks{background:none;border:0;color:var(--info);cursor:pointer;padding:4px;text-decoration:underline}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--garis);background:var(--muka);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:80px;resize:vertical}
label.ruas{display:block;margin-bottom:10px}
label.ruas>span{display:block;font-size:13px;color:var(--tinta-2);margin-bottom:3px;font-weight:600}
label.ruas small{display:block;color:var(--tinta-2);font-size:12px;margin-top:2px}
.ruas-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.cek{display:flex;gap:8px;align-items:center;margin:6px 0}
.cek input{width:20px;height:20px}
fieldset{border:1px solid var(--garis);border-radius:8px;margin:0 0 12px;padding:8px 12px}
legend{font-weight:700;font-size:14px;padding:0 4px}

.tabel-bungkus{overflow-x:auto;border:1px solid var(--garis);border-radius:8px;background:var(--muka)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:top}
th{background:var(--muka-2);position:sticky;top:0;font-size:13px;white-space:nowrap;cursor:default}
th.urut{cursor:pointer}
td.n,th.n{text-align:right}
tr.pilih td{background:#FFF8DB}
[data-tema="gelap"] tr.pilih td{background:#3A3312}

.subtab{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.subtab button{border:1px solid var(--garis);background:var(--muka);border-radius:99px;padding:6px 13px;white-space:nowrap;cursor:pointer}
.subtab button[aria-pressed="true"]{background:var(--tinta);color:var(--muka);border-color:var(--tinta)}

/* Peta */
.peta-wadah{position:relative;border:1px solid var(--garis);border-radius:var(--r);overflow:hidden;background:#DDE5DB}
#peta{height:calc(100vh - 230px);min-height:380px}
.peta-kisi{background-color:#E3EAE1;background-image:linear-gradient(#cfd9cd 1px,transparent 1px),linear-gradient(90deg,#cfd9cd 1px,transparent 1px);background-size:40px 40px}
[data-tema="gelap"] .peta-kisi{background-color:#1a241d;background-image:linear-gradient(#26332a 1px,transparent 1px),linear-gradient(90deg,#26332a 1px,transparent 1px)}
.peta-alat{position:absolute;z-index:500;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.peta-alat button{width:42px;height:42px;border-radius:8px;border:1px solid var(--garis);background:var(--muka);cursor:pointer;font-size:18px;box-shadow:var(--bayang)}
.peta-atas{position:absolute;z-index:500;top:10px;left:54px;right:62px;display:flex;gap:6px;flex-wrap:wrap}
.peta-atas select{width:auto;min-height:36px;padding:4px 8px;box-shadow:var(--bayang)}
.legenda{position:absolute;z-index:500;left:10px;bottom:24px;background:var(--muka);border:1px solid var(--garis);border-radius:8px;padding:8px 10px;font-size:13px;max-width:230px;box-shadow:var(--bayang)}
.legenda button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 2px;cursor:pointer;width:100%;text-align:left}
.legenda button[aria-pressed="true"]{font-weight:800;text-decoration:underline}
.legenda.lipat .legenda-isi{display:none}
.legenda .kotak{width:16px;height:12px;border:1px solid rgba(0,0,0,.4);flex:none}
.label-blok{position:absolute;left:0;top:0;font-weight:900;font-size:11px;color:#111;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 2px #fff,0 0 2px #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;pointer-events:none;letter-spacing:.04em}
.titik-gps{width:18px;height:18px;border-radius:50%;background:#1D5FA8;border:3px solid #fff;box-shadow:0 0 0 2px #1D5FA8}
.leaflet-container{font-family:var(--fon)}
.peta-penuh{position:fixed!important;inset:0;z-index:3000;border-radius:0}
.peta-penuh #peta{height:100vh}

/* Modal */
.tirai{position:fixed;inset:0;background:rgba(10,18,12,.55);z-index:4000;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.tirai{align-items:center;padding:20px}}
.modal{background:var(--muka);width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0}
@media (min-width:720px){.modal{border-radius:14px}}
.modal.lebar{max-width:1080px}
.modal-kepala{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--garis)}
.modal-kepala h2{margin:0;font-size:17px;flex:1;min-width:0}
.modal-isi{padding:14px;overflow:auto;flex:1}
.modal-kaki{padding:10px 14px;border-top:1px solid var(--garis);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--tinta);color:var(--muka);padding:10px 14px;border-radius:10px;box-shadow:var(--bayang);pointer-events:auto;white-space:pre-line}
#toast div.galat{background:var(--bahaya);color:#fff}

.batang{height:10px;background:var(--muka-2);border-radius:99px;overflow:hidden;border:1px solid var(--garis)}
.batang>i{display:block;height:100%;background:var(--daun)}
.daftar-blok{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.item{border:1px solid var(--garis);border-radius:8px;padding:10px;background:var(--muka)}
.item.dipilih{outline:3px solid var(--patok)}
.kosong{padding:26px;text-align:center;color:var(--tinta-2);border:1px dashed var(--garis);border-radius:10px}
.catatan-kendala{background:#FFF4E0;border-left:4px solid var(--waspada);padding:8px 10px;border-radius:6px;margin:6px 0;color:#4A2A05}
.catatan-kons{background:#E0F2EF;border-left:4px solid var(--kons);padding:8px 10px;border-radius:6px;margin:6px 0;color:#0B3F3A}
.lencana-antrean{background:var(--patok);color:#111;border-radius:99px;padding:0 6px;font-size:12px;font-weight:800}
svg text{font-family:var(--fon)}

/* Layar masuk */
#layarMasuk{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--pelepah)}
.kotak-masuk{background:var(--muka);border-radius:14px;padding:22px;width:100%;max-width:400px}
.kotak-masuk h1{margin:0 0 4px;font-size:22px}

/* Cetak */
#lembarCetak{display:none}
@media print{
  @page{size:A3 landscape;margin:8mm}
  body>*:not(#lembarCetak){display:none!important}
  #lembarCetak{display:block!important}
  html,body{background:#fff}
}
.hanya-layar{}
</style>

function kelasUmur(u) {

  if (u < 15) return '< 15 thn (Muda)';

  if (u <= 25) return '21-25 thn (Tua)';
  return '> 25 thn (Sangat Tua)';
}
function kelasLereng(s) {
  if (s <= 8) return '0-8% (Rendah)';
  if (s <= 15) return '8-15% (Sedang)';
  if (s <= 25) return '15-25% (Tinggi)';

/* Kemiringan garis kuadrat terkecil (ton/ha per tahun). Butuh >= 3 titik. */

/* Riwayat produksi sebuah blok: ambil 5 tahun terakhir yang tercatat, tahun berjalan dikecualikan

}

function skorKriteria(nilai) {

  if (nilai.sph !== null) {

  if (nilai.lereng !== null) {

/* Survei TERAKHIR yang disetujui untuk blok. Survei tertunda/ditolak tidak memengaruhi skor. */
function surveiBerlaku(daftarSurvei) {
  var ok = (daftarSurvei || []).filter(function (s) { return s.status === 'DISETUJUI'; });
  ok.sort(function (a, b) { return String(b.tanggal || '').localeCompare(String(a.tanggal || '')) || String(b.ditinjauPada || '').localeCompare(String(a.ditinjauPada || '')); });
  return ok[0] || null;
}

function nilaiBlok(blok, riwayat, daftarSurvei, bobotMasuk, paramMasuk, tahunIni) {
  var bobot = rapikanBobot(bobotMasuk);
  var p = gabungParam(paramMasuk, tahunIni);
  var tahunTanam = angka(blok.tahunTanam, null);
  var umur = (tahunTanam && tahunIni) ? Math.max(0, tahunIni - tahunTanam) : null;
  var prod = ringkasProduksi(riwayat, tahunIni);
  var sv = surveiBerlaku(daftarSurvei);

  var nilai = {
    umur: umur, produksi: prod.rata, tren: prod.tren, sph: sph,

    tanah: blok.kesesuaianTanah || '', jalanBaru: angka(blok.perluJalanBaruM, null)

  var mentah = skorKriteria(nilai);
  var total = 0, jumlah = 0, rincian = [], kurang = [];
  KRITERIA.forEach(function (kr) {
    var w = bobot[kr.k];

    rincian.push({ k: kr.k, label: kr.label, mentah: mentah[kr.k], bobot: w, sumbangan: null });

  rincian.forEach(function (r) { if (r.mentah !== null && total > 0) r.sumbangan = bulat(r.mentah * r.bobot / total, 1); });

  var bobotTerpakaiPersen = 0, semua = 0;

  bobotTerpakaiPersen = semua > 0 ? bulat(total / semua * 100, 0) : 0;

  var skorLap = sv && adaAngka(sv.skorLapangan) ? Math.max(0, Math.min(100, Number(sv.skorLapangan))) : null;
  var skorAkhir = skorGis === null ? null : (skorLap === null ? skorGis : bulat((skorGis + skorLap) / 2, 1));

  var kendala = [];

  if (benar(blok.hcs)) kendala.push('Beririsan kawasan HCS');
  if (benar(blok.sempadanSungai)) kendala.push('Dalam sempadan sungai: bagian sempadan tidak ditanam ulang');

  else if ((umur !== null && umur >= p.tinjauUmur) || (prod.rata !== null && prod.rata < p.tinjauProduksi)) kelayakan = 'TINJAU';
  else kelayakan = 'TIDAK';
  if (!konservasi && benar(blok.sempadanSungai) && kelayakan === 'YA') kelayakan = 'TINJAU';
  if (!konservasi && sv) {
    if (sv.rekomendasi === 'Tidak') { kelayakan = 'TIDAK'; kendala.push('Survei lapangan merekomendasikan tidak diremajakan'); }
    else if (sv.rekomendasi === 'Ya' && kelayakan === 'TINJAU') kelayakan = 'YA';
  }

  var prioritas;
  if (konservasi) prioritas = 'KONS';
  else if (skorAkhir === null) prioritas = '-';

  if (benar(blok.sempadanSungai) && !adaAngka(blok.luasSempadanHa)) kendala.push('Luas sempadan belum diisi: luas tanam ulang belum dikurangi');

    id: blok.id, umur: umur, kelasUmur: kelasUmur(umur), kelasLereng: nilai.lereng === null ? '-' : kelasLereng(nilai.lereng),
    produksiRata: prod.rata, tren: prod.tren, titikProduksi: prod.titik,
    sph: sph, sumberSph: sumberSph, persenPopulasi: (sph !== null && p.sphStandar > 0) ? bulat(sph / p.sphStandar * 100, 1) : null,
    rincian: rincian, dataKurang: kurang, bobotTerpakaiPersen: bobotTerpakaiPersen,
    skorGis: skorGis, skorLapangan: skorLap, skorAkhir: skorAkhir, surveiId: sv ? sv.id : '',
    kelayakan: kelayakan, prioritas: prioritas, kendala: kendala,

}

/* Nilai seluruh blok sekaligus. data = {blok, produksi, survei} */
function nilaiSemua(data, bobot, param, tahunIni) {
  var prodPer = {}, svPer = {};
  (data.produksi || []).forEach(function (r) { (prodPer[r.blokId] = prodPer[r.blokId] || []).push(r); });
  (data.survei || []).forEach(function (s) { (svPer[s.blokId] = svPer[s.blokId] || []).push(s); });
  return (data.blok || []).map(function (b) { return nilaiBlok(b, prodPer[b.id], svPer[b.id], bobot, param, tahunIni); });

/* ---------------- Geometri ---------------- */
function bacaPoligon(v) {
  if (!v) return null;
  var a = v;

  if (!a || !a.length || a.length < 3) return null;
  var o = [];
  for (var i = 0; i < a.length; i++) {

    o.push([la, ln]);

}

/* Luas geodesik (rumus yang sama dengan Leaflet.draw GeometryUtil), hektar. */
function luasPoligonHa(latlng) {

  return Math.abs(luas * R * R / 2) / 10000;
}

function pusatPoligon(latlng) {
  if (!latlng || !latlng.length) return null;
  var sa = 0, sb = 0;
  latlng.forEach(function (p) { sa += p[0]; sb += p[1]; });
  return [sa / latlng.length, sb / latlng.length];
}

function keMeter(p, lat0) {

  return [p[1] * m * Math.cos(lat0 * Math.PI / 180), p[0] * 110574];
}

  var dx = b[0] - a[0], dy = b[1] - a[1];
  var L = dx * dx + dy * dy, t = L === 0 ? 0 : ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / L;
  t = Math.max(0, Math.min(1, t));
  var x = a[0] + t * dx - pt[0], y = a[1] + t * dy - pt[1];
  return Math.sqrt(x * x + y * y);
}

  var lat0 = A[0][0];
  var a = A.map(function (p) { return keMeter(p, lat0); }), b = B.map(function (p) { return keMeter(p, lat0); });

  for (i = 0; i < a.length; i++) for (j = 0; j < b.length; j++) {
    min = Math.min(min, jarakTitikSegmen(a[i], b[j], b[(j + 1) % b.length]));
  }
  for (i = 0; i < b.length; i++) for (j = 0; j < a.length; j++) {
    min = Math.min(min, jarakTitikSegmen(b[i], a[j], a[(j + 1) % a.length]));
  }
  return min;

/* ---------------- Roadmap & cluster ---------------- */
function kandidatReplanting(h, p) {
  return (h.kelayakan === 'YA' || (h.kelayakan === 'TINJAU' && h.skorAkhir !== null && h.skorAkhir >= p.ambangP2)) && h.luasTanamHa > 0;
}

function susunRoadmap(data, hasil, paramMasuk, tahunIni, targetHa) {
  var p = gabungParam(paramMasuk, tahunIni);
  var target = targetHa ? Number(targetHa) : p.targetHaTahun;
  var blokPer = {}; (data.blok || []).forEach(function (b) { blokPer[b.id] = b; });
  var hasilPer = {}; hasil.forEach(function (h) { hasilPer[h.id] = h; });
  var peringatan = [];
  var tahunList = [];
  for (var t = 0; t < Math.max(1, p.horizonTahun); t++) tahunList.push(p.tahunMulai + t);

  var kand = hasil.filter(function (h) { return kandidatReplanting(h, p); });
  var poli = {};
  kand.forEach(function (h) { poli[h.id] = bacaPoligon(blokPer[h.id] && blokPer[h.id].poligon); });
  var tetangga = {};
  kand.forEach(function (h) { tetangga[h.id] = []; });
  for (var i = 0; i < kand.length; i++) for (var j = i + 1; j < kand.length; j++) {
    var a = kand[i], b = kand[j], ba = blokPer[a.id], bb = blokPer[b.id];

    if (jarakPoligonM(poli[a.id], poli[b.id]) <= p.toleransiBersebelahanM) { tetangga[a.id].push(b.id); tetangga[b.id].push(a.id); }
  }

  if (tanpaPoligon.length) peringatan.push(tanpaPoligon.length + ' blok kandidat tanpa poligon, tidak bisa dikelompokkan dengan blok tetangga: ' + tanpaPoligon.join(', '));

  urut.forEach(function (h) {

      sudah[h.id] = true;

      tahunan[th].luasHa += h.luasTanamHa;

  function tahunBerikut() {
    while (idxTahun < tahunList.length && tahunan[tahunList[idxTahun]].luasHa >= target) idxTahun++;
    return idxTahun < tahunList.length ? tahunList[idxTahun] : null;
  }
  for (var u = 0; u < urut.length; u++) {
    var benih = urut[u];
    if (sudah[benih.id]) continue;
    var th2 = tahunBerikut();
    if (th2 === null) break;
    var wadah = tahunan[th2];
    var anggota = [benih.id]; sudah[benih.id] = true; wadah.luasHa += benih.luasTanamHa;
    if (benih.luasTanamHa > target) peringatan.push('Blok ' + benih.id + ' (' + bulat(benih.luasTanamHa, 1) + ' ha) lebih luas dari target tahunan ' + target + ' ha');
    var tepi = tetangga[benih.id].slice();

      if (!tepi.length) break;

  var nomor = 0;
  tahunList.forEach(function (th) {
    var w = tahunan[th];
    w.luasHa = 0; w.bibit = 0; w.capex = 0; w.excHari = 0; w.dozHari = 0; w.jalanBaruM = 0; w.kehilanganTon = 0;
    w.cluster.forEach(function (c) {
      nomor++;
      c.kode = 'CL-' + th + '-' + (nomor < 10 ? '0' : '') + nomor;
      var luas = 0, jalan = 0, lossTon = 0, skor = 0;
      var estate = {}, afd = {};
      c.blokIds.forEach(function (id) {
        var h = hasilPer[id], bk = blokPer[id];
        luas += h.luasTanamHa; jalan += angka(bk.perluJalanBaruM, 0);
        lossTon += h.luasTanamHa * (h.produksiRata || 0);
        skor += (h.skorAkhir || 0) * h.luasTanamHa;
        estate[bk.estate || '-'] = 1; afd[bk.afdeling || '-'] = 1;
      });
      c.estate = Object.keys(estate).join(', ');
      c.afdeling = Object.keys(afd).join(', ');
      c.luasHa = bulat(luas, 2);
      c.skorRata = luas > 0 ? bulat(skor / luas, 1) : null;
      c.jalanBaruM = jalan;
      c.bibit = Math.ceil(luas * p.sphStandar * p.faktorCadangan);
      c.excHari = Math.ceil(luas * p.excavatorHariHa);

      c.kehilanganTonTahun = bulat(lossTon, 1);
      w.luasHa += luas; w.bibit += c.bibit; w.capex += c.capex; w.excHari += c.excHari; w.dozHari += c.dozHari; w.jalanBaruM += jalan; w.kehilanganTon += lossTon;

    }

  if (diluar.length) peringatan.push(diluar.length + ' blok kandidat belum tertampung dalam horizon ' + p.horizonTahun + ' tahun dengan target ' + target + ' ha/tahun');

}

/* ---------------- Analisis finansial per hektar ----------------
 * Membandingkan dua pilihan selama lamaAnalisisTahun:
 *  A. Pertahankan tanaman tua: produksi turun mengikuti tren (tidak di bawah produksiMinimumTua).
 *  B. Remajakan tahun ke-1: capex/ha di tahun 1, TBM tanpa hasil, lalu mengikuti kurva.
 * Semua angka ASUMSI dari parameter; hasilnya estimasi, bukan jaminan. */
function analisisFinansial(h, blok, paramMasuk, tahunIni) {
  var p = gabungParam(paramMasuk, tahunIni);
  var r = p.diskontoPersen / 100, N = Math.max(1, Math.round(p.lamaAnalisisTahun));

      '<div class="batang"><i style="width:' + p.toFixed(1) + '%;background:' + (x.warna || 'var(--daun)') + '"></i></div></div>';
  }).join('') + '</div>';
}
function grafikGaris(seri, opsi) {

  if (!xs.length) return '<div class="kosong">Belum ada data</div>';

  var lx = Object.keys(labelX).map(Number).sort(function (a, b) { return a - b; });

  seri.forEach(function (s) {

  });
  g += '</svg>';

    lereng: [['a', '0–8%', '', '#3F7D4E'], ['b', '8–15%', '', '#C9A00C'], ['c', '15–25%', '', '#E07B12'], ['d', '> 25%', '', '#B42318'], ['-', 'Kosong', '', '#8B958E']],
    survei: [['DISETUJUI', 'Survei disetujui', '', '#3F7D4E'], ['TERTUNDA', 'Menunggu tinjauan', '', '#E07B12'], ['DITOLAK', 'Hanya survei ditolak', '', '#B42318'], ['-', 'Belum disurvei', '', '#8B958E']]
  };
  if (jenis === 'rencana') {
    var pal = ['#B42318', '#E07B12', '#C9A00C', '#3F7D4E', '#1D5FA8', '#6B21A8', '#9C6B3F', '#0F766E'], o = [];
    for (var i = 0; i < p.horizonTahun; i++) o.push([String(p.tahunMulai + i), String(p.tahunMulai + i), '', pal[i % pal.length]]);

function kelasBlok(jenis, h, rencana) {

  if (jenis === 'umur') return h.umur === null ? '-' : h.umur < 15 ? 'm' : h.umur <= 20 ? 'n' : h.umur <= 25 ? 't' : 's';
  if (jenis === 'produksi') { var y = h.produksiRata; return y === null ? '-' : y < 14 ? 'a' : y < 18 ? 'b' : y < 22 ? 'c' : 'd'; }
  if (jenis === 'populasi') { var q = h.persenPopulasi; return q === null ? '-' : q < 70 ? 'a' : q < 85 ? 'b' : q < 95 ? 'c' : 'd'; }
  if (jenis === 'lereng') { var bk = S.blokPer[h.id], l = bk ? angka(bk.lerengPersen, null) : null; return l === null ? '-' : l <= 8 ? 'a' : l <= 15 ? 'b' : l <= 25 ? 'c' : 'd'; }

    var sv = S.data.survei.filter(function (s) { return s.blokId === h.id; });
    if (sv.some(function (s) { return s.status === 'DISETUJUI'; })) return 'DISETUJUI';
    if (sv.some(function (s) { return s.status === 'TERTUNDA'; })) return 'TERTUNDA';

}

function gambarInfra() {

      if (l.jenis === 'geojson') lyr = L.geoJSON(JSON.parse(l.data), { style: { color: l.warna, weight: 2, fillOpacity: 0.15 * (l.opasitas || 0.8) }, pointToLayer: function (f, ll) { return L.circleMarker(ll, { radius: 5, color: l.warna }); }, onEachFeature: function (f, x) { var pr = f.properties || {}; var n = pr.nama || pr.name || pr.NAMA || ''; if (n) x.bindTooltip(esc(n)); } });

      else if (l.jenis === 'wms') lyr = L.tileLayer.wms(l.url, { layers: l.lapisWms, format: 'image/png', transparent: true, opacity: l.opasitas, attribution: esc(l.atribusi) });

/* GPS jujur: bila gagal, katakan gagal. Tidak pernah memakai posisi simulasi. */
function lokasiSaya() {

  var t = $('#tblGps'); if (t) t.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(function (pos) {

    if (P.gps) P.gps.forEach(function (x) { P.peta.removeLayer(x); });
    P.gps = [L.circle(ll, { radius: ak, color: '#1D5FA8', weight: 1, fillOpacity: 0.12 }).addTo(P.peta),
      L.marker(ll, { icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="titik-gps"></div>' }) }).bindTooltip('Lokasi Anda (±' + Math.round(ak) + ' m)').addTo(P.peta)];
    P.peta.setView(ll, Math.max(P.peta.getZoom(), 16));
    var dalam = blokTersaring().filter(function (b) { var pg = bacaPoligon(b.poligon); return pg && titikDalamPoligon(ll, pg); })[0];
    toast('Ketelitian ±' + Math.round(ak) + ' m' + (dalam ? ' · Anda berada di blok ' + dalam.id : ''));
  }, function (err) {
    if (t) t.textContent = '📍';
    var pesan = { 1: 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan peramban.', 2: 'Posisi tidak dapat ditentukan (sinyal GPS lemah).', 3: 'GPS terlalu lama merespons. Coba di tempat terbuka.' }[err.code] || err.message;
    toast(pesan, true);
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
}
function titikDalamPoligon(p, pg) {
  var dalam = false;
  for (var i = 0, j = pg.length - 1; i < pg.length; j = i++) {
    if (((pg[i][0] > p[0]) !== (pg[j][0] > p[0])) && (p[1] < (pg[j][1] - pg[i][1]) * (p[0] - pg[i][0]) / (pg[j][0] - pg[i][0]) + pg[i][1])) dalam = !dalam;

  return dalam;
}

/* Poligon dapat ditempel sebagai [[lat,lng],...] atau GeoJSON Polygon/Feature ([lng,lat]). */
function uraiPoligonMasukan(teksMasuk) {
  var t = String(teksMasuk || '').trim();
  if (!t) return '';
  var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Poligon bukan JSON yang sah'); }
  if (j && j.type === 'FeatureCollection') { if (!j.features || j.features.length !== 1) throw new Error('FeatureCollection harus berisi tepat satu fitur. Untuk banyak blok pakai Data Blok ▸ Impor Geometri.'); j = j.features[0]; }
  if (j && j.type === 'Feature') j = j.geometry;
  if (j && (j.type === 'Polygon' || j.type === 'MultiPolygon')) { var cincin = j.type === 'Polygon' ? j.coordinates[0] : j.coordinates[0][0]; j = cincin.map(function (c) { return [c[1], c[0]]; }); }
  if (!(j instanceof Array)) throw new Error('Format poligon tidak dikenali');
  if (j.length > 3 && j[0][0] === j[j.length - 1][0] && j[0][1] === j[j.length - 1][1]) j = j.slice(0, -1);
  var pg = bacaPoligon(j);
  if (!pg) {
    var tukar = bacaPoligon(j.map(function (p) { return [p[1], p[0]]; }));
    throw new Error(tukar ? 'Lintang dan bujur tampaknya tertukar. Urutan yang diminta [lintang, bujur].' : 'Poligon butuh minimal 3 titik [lintang, bujur] yang sah');
  }
  return pg;
}

/* ---------- CSV ---------- */
function uraiCsv(teks) {
  teks = String(teks || '').replace(/^\uFEFF/, '');
  var baris1 = teks.split(/\r?\n/)[0] || '';
  var pemisah = [';', ',', '\t'].map(function (p) { return [p, baris1.split(p).length]; }).sort(function (a, b) { return b[1] - a[1]; })[0][0];
  var baris = [], sel = '', isi = [], kutip = false;
  for (var i = 0; i < teks.length; i++) {
    var c = teks[i];
    if (kutip) {
      if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else kutip = false; }
      else sel += c;
    } else if (c === '"') kutip = true;
    else if (c === pemisah) { isi.push(sel); sel = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && teks[i + 1] === '\n') i++;
      isi.push(sel); sel = '';
      if (isi.some(function (x) { return x.trim() !== ''; })) baris.push(isi);
      isi = [];
    } else sel += c;
  }
  isi.push(sel);
  if (isi.some(function (x) { return x.trim() !== ''; })) baris.push(isi);
  if (!baris.length) return { judul: [], data: [] };
  var judul = baris[0].map(function (j) { return j.trim(); });
  return { judul: judul, data: baris.slice(1).map(function (r) { var o = {}; judul.forEach(function (j, k) { o[j] = (r[k] || '').trim(); }); return o; }) };
}
/* Titik koma + BOM: Excel berbahasa Indonesia membaca koma sebagai desimal. */
function keCsv(judul, baris) {
  function sel(v) { var s = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  return '\uFEFF' + [judul.map(sel).join(';')].concat(baris.map(function (r) { return r.map(sel).join(';'); })).join('\r\n');
}
function angkaId(v) { if (v === '' || v === null || v === undefined) return ''; var s = String(v).trim().replace(/\s/g, ''); if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, ''); return Number(s.replace(',', '.')); }
function tglBerkas() { var d = new Date(); return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }

function renderData(isi) {

/* ================= 07-skoring.js : bobot MCDA & peringkat ================= */
function bobotTersimpan() { return rapikanBobot(S.data.setelan.bobot); }
function bobotSama(a, b) { return KRITERIA.every(function (k) { return Number(a[k.k]) === Number(b[k.k]); }); }

function renderSkoring(isi) {
  var b = S.bobotAktif, tersimpan = bobotTersimpan();
  var profil = S.data.setelan.profilBobot || [];
  isi.innerHTML = '<div class="kisi kisi-2">' +
    '<div class="kartu"><div class="baris antara"><h2>Bobot kriteria</h2><span id="skTotal" class="kecil"></span></div>' +
    '<p class="kecil redup">Geser untuk melihat pengaruhnya langsung. Bobot dinormalisasi otomatis, jadi jumlahnya tidak harus 100. Perubahan hanya berlaku di perangkat ini sampai disimpan.</p>' +
    KRITERIA.map(function (k) {
      return '<label class="ruas"><div class="baris antara kecil"><b>' + esc(k.label) + '</b><span class="angka"><b id="skV_' + k.k + '">' + b[k.k] + '</b> <span class="redup" id="skP_' + k.k + '"></span></span></div>' +
        '<input type="range" min="0" max="100" step="1" value="' + b[k.k] + '" data-bobot="' + k.k + '" style="width:100%" aria-label="Bobot ' + esc(k.label) + '"></label>';
    }).join('') +
    '<div id="skStatus"></div><div class="baris"><button class="tbl" id="skBawaan">Kembalikan bawaan</button><button class="tbl" id="skMuat">Muat bobot tersimpan</button>' +
    (bolehEdit() ? '<button class="tbl utama" id="skSimpan">Simpan sebagai bobot resmi</button>' : '') + '</div></div>' +
    '<div class="kartu"><h2>Profil bobot</h2><p class="kecil redup">Simpan beberapa kombinasi bobot untuk dibandingkan, mis. "Fokus produksi" vs "Fokus umur".</p><div id="skProfil">' +
    (profil.length ? profil.map(function (p, i) { return '<div class="baris antara item" style="margin-bottom:6px"><b>' + esc(p.nama) + '</b><span class="baris"><button class="tbl kecil" data-profil-pakai="' + i + '">Pakai</button>' + (bolehEdit() ? '<button class="tbl kecil bahaya" data-profil-hapus="' + i + '">✕</button>' : '') + '</span></div>'; }).join('') : '<p class="redup">Belum ada profil.</p>') +
    '</div>' + (bolehEdit() ? '<div class="baris"><input type="text" id="skNamaProfil" placeholder="Nama profil" style="flex:1;min-width:140px"><button class="tbl" id="skSimpanProfil">Simpan bobot ini sebagai profil</button></div>' : '') +
    '<h3>Sebaran prioritas</h3><div id="skSebaran"></div></div></div>' +
    '<div class="kartu"><div class="baris antara"><h2>Peringkat blok</h2><label class="cek kecil"><input type="checkbox" id="skHanyaBerubah"' + (S._skHanyaBerubah ? ' checked' : '') + '> hanya yang peringkatnya berubah</label></div><div id="skPeringkat"></div></div>';

  var jeda;
  isi.oninput = function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-bobot'); if (!k) return;
    S.bobotAktif[k] = Number(e.target.value);
    $('#skV_' + k).textContent = e.target.value;
    perbaruiPersen();
    clearTimeout(jeda);
    jeda = setTimeout(function () { hitungUlang(); gambarHasil(); }, 120);
  };
  isi.onclick = function (e) {
    var pk = e.target.closest('[data-profil-pakai]');
    if (pk) { S.bobotAktif = rapikanBobot(profil[Number(pk.getAttribute('data-profil-pakai'))].bobot); hitungUlang(); render(); toast('Profil diterapkan (belum disimpan sebagai resmi)'); return; }
    var ph = e.target.closest('[data-profil-hapus]');
    if (ph) {
      var i = Number(ph.getAttribute('data-profil-hapus'));
      konfirmasi('Hapus profil', 'Hapus profil "' + esc(profil[i].nama) + '"?', 'Hapus', true).then(function (ya) {
        if (!ya) return;
        var baru = profil.filter(function (x, j) { return j !== i; });
        api('setelan_simpan', { kunci: 'profilBobot', nilai: baru }).then(function (v) { S.data.setelan.profilBobot = v; simpanCache(); render(); }).catch(galatKeToast);
      });
    }
  };
  $('#skBawaan').onclick = function () { S.bobotAktif = rapikanBobot(BOBOT_BAWAAN); hitungUlang(); render(); };
  $('#skMuat').onclick = function () { S.bobotAktif = bobotTersimpan(); hitungUlang(); render(); };
  if ($('#skSimpan')) $('#skSimpan').onclick = function () {
    var tb = this;
    konfirmasi('Simpan bobot resmi', 'Bobot ini akan dipakai semua pengguna dan untuk snapshot roadmap ke Spreadsheet.', 'Simpan').then(function (ya) {
      if (!ya) return; tb.disabled = true;
      api('setelan_simpan', { kunci: 'bobot', nilai: S.bobotAktif }).then(function (v) { S.data.setelan.bobot = v; simpanCache(); toast('Bobot resmi tersimpan'); render(); }).catch(function (e) { tb.disabled = false; galatKeToast(e); });
    });
  };
  if ($('#skSimpanProfil')) $('#skSimpanProfil').onclick = function () {
    var nama = $('#skNamaProfil').value.trim(); if (!nama) return toast('Isi nama profil', true);
    var baru = profil.filter(function (p) { return p.nama.toLowerCase() !== nama.toLowerCase(); }).concat([{ nama: nama, bobot: S.bobotAktif }]);
    api('setelan_simpan', { kunci: 'profilBobot', nilai: baru }).then(function (v) { S.data.setelan.profilBobot = v; simpanCache(); toast('Profil "' + nama + '" tersimpan'); render(); }).catch(galatKeToast);
  };
  $('#skHanyaBerubah').onchange = function () { S._skHanyaBerubah = this.checked; gambarHasil(); };

  function perbaruiPersen() {
    var jml = 0; KRITERIA.forEach(function (k) { jml += S.bobotAktif[k.k]; });
    KRITERIA.forEach(function (k) { $('#skP_' + k.k).textContent = jml ? '(' + fAngka(S.bobotAktif[k.k] / jml * 100, 0) + '%)' : ''; });
    $('#skTotal').innerHTML = jml ? 'Jumlah ' + jml : '<b style="color:var(--bahaya)">Semua bobot nol</b>';
    var sama = bobotSama(S.bobotAktif, tersimpan);
    $('#skStatus').innerHTML = sama ? '<p class="kecil redup">Sama dengan bobot resmi.</p>' : '<div class="spanduk waspada" style="border-radius:8px;margin-bottom:8px">Bobot uji coba, berbeda dari bobot resmi. Peta, roadmap, dan dasbor di perangkat ini memakai bobot ini.</div>';
  }
  function gambarHasil() {
    var hasil = hasilTersaring();
    var p = S.data.setelan.parameter;
    // Peringkat pembanding memakai bobot resmi
    var d = dataTersaring();
    var resmi = nilaiSemua(d, tersimpan, p, S.data.tahunIni);
    var urutResmi = resmi.filter(function (h) { return h.skorAkhir !== null; }).sort(function (a, c) { return c.skorAkhir - a.skorAkhir; });
    var pr = {}; urutResmi.forEach(function (h, i) { pr[h.id] = i + 1; });
    var prioResmi = {}; resmi.forEach(function (h) { prioResmi[h.id] = h.prioritas; });
    var urut = hasil.slice().sort(function (a, c) { return (c.skorAkhir === null ? -1 : c.skorAkhir) - (a.skorAkhir === null ? -1 : a.skorAkhir); });
    var n = {}; hasil.forEach(function (h) { n[h.prioritas] = (n[h.prioritas] || 0) + 1; });

    var berubah = 0;
    var baris = urut.map(function (h, i) {
      var rk = h.skorAkhir === null ? null : i + 1, lama = pr[h.id], delta = rk && lama ? lama - rk : 0;
      var ganti = prioResmi[h.id] !== h.prioritas;
      if (delta || ganti) berubah++;
      if (S._skHanyaBerubah && !delta && !ganti) return '';
      return '<tr><td class="n">' + (rk || '–') + '</td><td>' + patok(h.id) + '</td><td class="n">' + (delta ? '<span style="color:' + (delta > 0 ? 'var(--bahaya)' : 'var(--daun)') + '">' + (delta > 0 ? '▲' + delta : '▼' + (-delta)) + '</span>' : '') + '</td><td>' + esc(S.blokPer[h.id].estate || '') + '</td><td class="n">' + fAngka(h.skorGis, 1) + '</td><td class="n">' + fAngka(h.skorLapangan, 0) + '</td><td class="n"><b>' + fAngka(h.skorAkhir, 1) + '</b></td><td>' + tagPrio(h.prioritas) + (ganti ? ' <span class="kecil redup">dari ' + esc(prioResmi[h.id]) + '</span>' : '') + '</td><td>' + esc(h.kelayakan) + '</td><td class="n">' + (h.bobotTerpakaiPersen < 100 ? '<span style="color:var(--waspada)">' + h.bobotTerpakaiPersen + '%</span>' : '100%') + '</td></tr>';
    }).join('');
    $('#skPeringkat').innerHTML = (bobotSama(S.bobotAktif, tersimpan) ? '' : '<p class="kecil">' + berubah + ' blok berubah peringkat atau prioritas dibanding bobot resmi. ▲ naik (lebih mendesak), ▼ turun.</p>') +
      '<div class="tabel-bungkus" style="max-height:70vh"><table><thead><tr><th class="n">#</th><th>Blok</th><th class="n">Δ</th><th>Estate</th><th class="n">GIS</th><th class="n">Lapangan</th><th class="n">Akhir</th><th>Prioritas</th><th>Kelayakan</th><th class="n">Data</th></tr></thead><tbody>' + (baris || '<tr><td colspan="10" class="redup">Tidak ada perubahan</td></tr>') + '</tbody></table></div>';
  }
  perbaruiPersen(); gambarHasil();
}

function renderRoadmap(isi) {
  var st = subtab('roadmap', [['rencana', 'Rencana tahunan'], ['kebutuhan', 'Kebutuhan sumber daya'], ['skenario', 'Bandingkan skenario']]);
  var p = S.data.setelan.parameter;

/* ================= 09-survei.js : survei lapangan ================= */
function kartuSurvei(s) {
  return '<div class="item" data-survei="' + esc(s.id) + '" style="cursor:pointer;margin-bottom:8px"><div class="baris antara"><span>' + patok(s.blokId) + ' <span class="tag ' + esc(s.status) + '">' + esc(s.status) + '</span>' + (s._antre ? ' <span class="tag">belum terkirim</span>' : '') + '</span><span class="kecil redup">' + fTanggal(s.tanggal) + '</span></div>' +
    '<div class="kecil" style="margin-top:4px">' + esc(s.surveyor) + ' · SPH ' + fAngka(s.sphHitung, 0) + ' · Ganoderma ' + fAngka(s.ganodermaPersen, 1) + '% · skor ' + fAngka(s.skorLapangan, 0) + ' · rekomendasi <b>' + esc(s.rekomendasi) + '</b>' + (s.adaFoto ? ' · 📷' : '') + '</div>' +
    (s.status === 'DITOLAK' && s.alasanTinjau ? '<div class="kecil" style="color:var(--bahaya)">Ditolak: ' + esc(s.alasanTinjau) + '</div>' : '') + '</div>';
}

function bolehTinjau(s) {
  if (!bolehEdit() || s.status !== 'TERTUNDA' || s._antre) return false;
  return s.dibuatOleh !== S.data.saya.email || bolehAdmin();
}

function renderSurvei(isi) {
  var tunda = S.data.survei.filter(function (s) { return s.status === 'TERTUNDA'; }).length;
  var st = subtab('survei', [['daftar', 'Daftar & tinjauan' + (tunda ? ' (' + tunda + ')' : '')], ['baru', 'Survei baru'], ['antrean', 'Antrean luring' + (S.antrean.length ? ' (' + S.antrean.length + ')' : '')], ['statistik', 'Statistik']]);
  isi.innerHTML = st.html + '<div id="svIsi"></div>';
  ({ daftar: svDaftar, baru: svBaru, antrean: svAntrean, statistik: svStatistik })[st.aktif]($('#svIsi'));
}

function svDaftar(el) {
  var f = S._svSaring || 'TERTUNDA';
  var ada = {}; blokTersaring().forEach(function (b) { ada[b.id] = 1; });
  var daftar = S.data.survei.filter(function (s) { return ada[s.blokId] && (f === 'SEMUA' || s.status === f); }).sort(function (a, b) { return String(b.tanggal).localeCompare(String(a.tanggal)); });

  el.innerHTML = '<div class="baris antara" style="margin-bottom:8px"><div class="subtab" style="margin:0">' + [['TERTUNDA', 'Menunggu'], ['DISETUJUI', 'Disetujui'], ['DITOLAK', 'Ditolak'], ['SEMUA', 'Semua']].map(function (x) { return '<button data-svf="' + x[0] + '" aria-pressed="' + (x[0] === f) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (bisa.length ? '<div class="baris"><label class="cek kecil"><input type="checkbox" id="svPilihSemua"> pilih semua (' + bisa.length + ')</label><button class="tbl kecil utama" id="svSetuju" disabled>Setujui</button><button class="tbl kecil bahaya" id="svTolak" disabled>Tolak</button></div>' : '') + '</div>' +
    (f === 'TERTUNDA' && daftar.length && !bisa.length && bolehEdit() ? '<p class="kecil redup">Survei yang Anda buat sendiri harus ditinjau editor lain atau admin.</p>' : '') +
    (daftar.length ? daftar.map(function (s) {
      return '<div class="baris" style="align-items:flex-start;gap:6px">' + (bolehTinjau(s) ? '<input type="checkbox" data-pilih-sv="' + esc(s.id) + '" style="width:22px;height:22px;margin-top:12px" aria-label="Pilih survei ' + esc(s.blokId) + '">' : '<span style="width:22px"></span>') + '<div style="flex:1">' + kartuSurvei(s) + '</div></div>';
    }).join('') : '<div class="kosong">Tidak ada survei ' + (f === 'SEMUA' ? '' : f.toLowerCase()) + ' pada saringan ini.</div>');
  function terpilih() { return $$('[data-pilih-sv]:checked').map(function (c) { return c.getAttribute('data-pilih-sv'); }); }
  function segarkan() { var n = terpilih().length; if ($('#svSetuju')) { $('#svSetuju').disabled = !n; $('#svTolak').disabled = !n; $('#svSetuju').textContent = 'Setujui' + (n ? ' (' + n + ')' : ''); $('#svTolak').textContent = 'Tolak' + (n ? ' (' + n + ')' : ''); } }
  el.onchange = function (e) {
    if (e.target.id === 'svPilihSemua') $$('[data-pilih-sv]').forEach(function (c) { c.checked = e.target.checked; });
    segarkan();
  };
  el.onclick = function (e) {
    var fb = e.target.closest('[data-svf]'); if (fb) { S._svSaring = fb.getAttribute('data-svf'); return svDaftar(el); }
    if (e.target.closest('[data-pilih-sv]') || e.target.closest('.patok')) return;
    var k = e.target.closest('[data-survei]'); if (k) return bukaDetailSurvei(k.getAttribute('data-survei'));

    if (e.target.id === 'svTolak') tinjauSurvei(terpilih(), 'DITOLAK');
  };
}

/* Tinjauan massal: TIDAK mengarang survei untuk blok yang belum disurvei (bug asli). Hanya survei nyata yang tertunda. */
function tinjauSurvei(ids, keputusan) {
  if (!ids.length) return;
  var lanjut = function (alasan) {
    return api('survei_tinjau', { ids: ids, keputusan: keputusan, alasan: alasan || '' }).then(function (r) {
      S.data.survei = r.survei.concat(S.data.survei.filter(function (s) { return s._antre; }));
      simpanCache(); hitungUlang();
      toast(r.diproses.length + ' survei ' + (keputusan === 'DISETUJUI' ? 'disetujui' : 'ditolak') + (r.dilewati.length ? '\n' + r.dilewati.length + ' dilewati: ' + r.dilewati.map(function (x) { return (x.blokId || x.id) + ' (' + x.alasan + ')'; }).join(', ') : ''), !!r.dilewati.length);
      if (modalTerbuka()) tutupModal();
      render();
    }).catch(galatKeToast);
  };
  if (keputusan === 'DITOLAK') {
    bukaModal('Tolak ' + ids.length + ' survei', bentukRuas({ k: 'alasan', label: 'Alasan penolakan', t: 'area', wajib: true, bantu: 'Terlihat oleh surveyor. Mis. "SPH tidak masuk akal, hitung ulang di jalur 3".' }), { kaki: '<button class="tbl" data-tutup>Batal</button><button class="tbl bahaya" id="tolakYa">Tolak</button>' });
    $('#tolakYa').onclick = function () { var a = $('#f_alasan').value.trim(); if (!a) return toast('Alasan wajib diisi', true); this.disabled = true; lanjut(a); };
  } else {
    var blok = S.data.survei.filter(function (s) { return ids.indexOf(s.id) >= 0; }).map(function (s) { return s.blokId; });
    konfirmasi('Setujui ' + ids.length + ' survei', 'Skor lapangan dan SPH hasil survei akan langsung memengaruhi skor blok: ' + blok.map(esc).join(', ') + '.', 'Setujui').then(function (ya) { if (ya) lanjut(''); });
  }
}

var RUAS_SURVEI = [
  { k: 'tanggal', label: 'Tanggal survei', t: 'tanggal', wajib: true }, { k: 'surveyor', label: 'Surveyor', wajib: true },
  { k: 'sphHitung', label: 'SPH hasil hitung (pokok/ha)', t: 'angka', min: 0, max: 400, bantu: 'Dari sampel petak ukur, dikonversi per hektar' },

  { k: 'ganodermaPersen', label: 'Serangan Ganoderma (%)', t: 'angka', min: 0, max: 100, langkah: '0.1' },
  { k: 'kondisiJalan', label: 'Kondisi jalan', t: 'pilih', opsi: [['', '—'], ['Baik', 'Baik'], ['Sedang', 'Sedang'], ['Rusak/Perlu Rintis', 'Rusak / perlu rintis']] },
  { k: 'drainase', label: 'Drainase', t: 'pilih', opsi: [['', '—'], ['Baik', 'Baik'], ['Tergenang/Banjir', 'Tergenang / banjir'], ['Perlu Cuci Parit', 'Perlu cuci parit']] },

  { k: 'skorLapangan', label: 'Skor lapangan (0–100)', t: 'angka', min: 0, max: 100, wajib: true, bantu: 'Makin tinggi makin mendesak. Tombol "Saran" menghitung dari isian di atas; boleh diubah.' },
  { k: 'catatan', label: 'Catatan', t: 'area' }
];
/* Saran skor transparan dari isian. Hanya saran; nilai akhir tetap keputusan surveyor. */
function saranSkorLapangan(o, sphStandar) {
  var bagian = [], skor = 0;
  if (adaAngka(o.ganodermaPersen)) { var g = Math.min(40, Number(o.ganodermaPersen) * 2); skor += g; bagian.push('Ganoderma ' + fAngka(g, 0)); }
  if (adaAngka(o.sphHitung) && sphStandar) { var s = Math.max(0, Math.min(35, (1 - Number(o.sphHitung) / sphStandar) * 100)); skor += s; bagian.push('populasi ' + fAngka(s, 0)); }
  if (adaAngka(o.kosongPersen)) { var k = Math.min(15, Number(o.kosongPersen) * 0.6); skor += k; bagian.push('titik kosong ' + fAngka(k, 0)); }
  if (o.drainase && o.drainase !== 'Baik') { skor += 5; bagian.push('drainase 5'); }
  if (o.kondisiJalan === 'Rusak/Perlu Rintis') { skor += 5; bagian.push('jalan 5'); }
  if (!bagian.length) return null;
  return { skor: Math.round(Math.min(100, skor)), rincian: bagian.join(' + ') };
}

  if (cfg.jenis === 'xyz') return cfg.url.replace('{z}', z).replace('{x}', x).replace('{y}', y).replace('{s}', 'a').replace('{r}', '');

  $('#pkHapus').onclick = function () {

}

/* ---------- Tentang ---------- */
function stTentang(el) {

  var isi = $('#ttIsi');

      [['Antarmuka', VERSI_KLIEN], ['Peladen (Code.gs)', vp || '–'], ['Mesin perhitungan (klien)', MESIN_VERSI], ['Mesin perhitungan (peladen)', S.data.mesinVersi || '–']].map(function (r) { return '<tr><th style="position:static;width:45%">' + r[0] + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      (beda ? '<div class="catatan-kendala" style="margin-top:10px"><b>Versi tidak cocok.</b> ' + (bandingVersi(vp, VERSI_KLIEN) > 0 ? (MODE === 'pwa' ? 'Unggah index.html terbaru ke hosting, lalu muat ulang paksa (tahan tombol muat ulang / hapus cache situs).' : 'Tempel ulang Index.html terbaru ke proyek Apps Script, lalu perbarui penerapan.') : 'Perbarui penerapan Web App: Deploy ▸ Manage deployments ▸ ikon pensil ▸ Version: New version ▸ Deploy. Tautan tidak berubah.') + ' Dari Spreadsheet, menu SawitGIS ▸ Cek Versi Berkas menunjukkan berkas mana yang tertinggal.</div>' : '<p class="kecil" style="color:var(--daun)">✓ Semua komponen cocok.</p>');
  } else if (st === 'syarat') isi.innerHTML = NASKAH_SYARAT;
  else if (st === 'privasi') isi.innerHTML = NASKAH_PRIVASI;
  else isi.innerHTML = '<h2>Komponen sumber terbuka</h2><p><b>Leaflet ' + esc(typeof L !== 'undefined' ? L.version : '') + '</b>, lisensi BSD 2-Clause, tertanam di aplikasi.</p><pre style="white-space:pre-wrap;font-size:12px;background:var(--muka-2);padding:10px;border-radius:8px">' + esc(typeof LISENSI_LEAFLET !== 'undefined' ? LISENSI_LEAFLET : '') + '</pre>' +
    '<p class="kecil">Tidak ada fon, ikon, citra, atau ubin peta pihak ketiga yang dimuat dari internet oleh aplikasi ini. Fon memakai fon sistem perangkat; ikon memakai emoji perangkat. Peta dasar hanya dimuat dari layanan yang dipasang admin sendiri.</p>';
}
var NASKAH_CATATAN_HUKUM = '<p class="kecil catatan-kendala">Naskah ini templat umum yang disusun bukan oleh advokat dan bukan nasihat hukum. Penyedia wajib melengkapi dan menyesuaikannya sebelum dipakai dalam perjanjian.</p>';
var NASKAH_SYARAT = '<h2>Syarat & ketentuan penggunaan</h2>' + NASKAH_CATATAN_HUKUM +
  '<h3>1. Sifat aplikasi</h3><p>SawitGIS Replanting adalah alat bantu perencanaan. Skor MCDA, prioritas, roadmap, dan analisis finansial adalah hasil perhitungan dari data dan asumsi yang dimasukkan pengguna. <b>Hasilnya bukan keputusan dan bukan jaminan.</b> Keputusan replanting tetap menjadi tanggung jawab manajemen kebun setelah verifikasi lapangan, agronomis, hukum, dan keuangan.</p>' +
  '<h3>2. Data</h3><p>Data disimpan di Google Spreadsheet milik pelanggan. Pelanggan bertanggung jawab atas kebenaran data, cadangan (salinan) Spreadsheet, dan pengaturan siapa yang memiliki akses ke berkas tersebut di Google Drive.</p>' +
  '<h3>3. Akun</h3><p>Setiap pengguna memakai akun sendiri. Dilarang berbagi PIN. Admin pelanggan bertanggung jawab menambah, menonaktifkan, dan mengatur peran pengguna.</p>' +
  '<h3>4. Lisensi</h3><p>Hak pakai diberikan sesuai paket dan masa berlaku kode lisensi untuk satu Spreadsheet. Dilarang mengubah Lisensi.gs atau mekanisme verifikasi lisensi, menyebarluaskan kode sumber, atau menjual ulang tanpa izin tertulis. Saat lisensi berakhir, aplikasi masuk mode pembaca dan data pelanggan tidak dihapus.</p>' +
  '<h3>5. Layanan pihak ketiga</h3><p>Aplikasi berjalan di atas layanan Google (Apps Script, Sheets) yang tunduk pada syarat Google. Peta dasar atau lapisan dari penyedia lain yang dipasang admin tunduk pada syarat penyedia tersebut; pelanggan bertanggung jawab memastikan haknya.</p>' +
  '<h3>6. Batas tanggung jawab</h3><p>[ISI oleh penyedia: batas tanggung jawab, garansi, dukungan, dan penyelesaian sengketa sesuai perjanjian.]</p>';
var NASKAH_PRIVASI = '<h2>Pemberitahuan privasi</h2>' + NASKAH_CATATAN_HUKUM +
  '<p>Disusun mengacu pada Undang-Undang No. 27 Tahun 2022 tentang Pelindungan Data Pribadi.</p>' +
  '<h3>Pengendali data</h3><p>Pengendali data adalah <b>organisasi pemilik Spreadsheet</b> tempat aplikasi ini dipasang, bukan penyedia perangkat lunak. Penyedia tidak memiliki akses ke Spreadsheet pelanggan kecuali diberi akses secara terpisah.</p>' +
  '<h3>Data pribadi yang diproses</h3><ul><li>Pengguna: surel, nama, jabatan, departemen, foto profil (opsional), waktu masuk terakhir, catatan aktivitas (log).</li><li>Survei: nama surveyor, koordinat GPS saat survei (hanya bila tombol ditekan), foto lapangan.</li></ul><p>PIN tidak disimpan dalam bentuk asli, melainkan hash bergaram.</p>' +
  '<h3>Ke mana data mengalir</h3><ul><li>Google (Apps Script & Sheets) sebagai tempat penyimpanan dan pemrosesan.</li><li>Penyedia peta dasar/lapisan yang dipasang admin: menerima alamat IP dan area peta yang dilihat.</li><li>Perangkat pengguna: salinan data untuk mode luring disimpan di peramban.</li></ul>' +
  '<h3>Yang tidak dilakukan aplikasi</h3><ul><li>Tidak mengirim data ke penyedia perangkat lunak.</li><li>Tidak memakai layanan analitik, iklan, atau pelacak.</li><li>Tidak melacak lokasi di latar belakang.</li></ul>' +
  '<h3>Perlu diketahui</h3><p>Siapa pun yang memiliki akses edit/lihat ke Spreadsheet di Google Drive dapat membaca seluruh data <b>tanpa melalui pemeriksaan peran aplikasi</b>. Batasi berbagi berkas hanya kepada admin.</p>' +
  '<h3>Hak subjek data</h3><p>Pengguna dapat meminta akses, perbaikan, atau penghapusan data pribadinya kepada admin organisasi: [ISI kontak pengendali data].</p>';

function kartuKapasitas(pn) {
  var k = pn.kapasitas, warna = k.persen >= 92 ? 'var(--bahaya)' : k.persen >= 80 ? 'var(--waspada)' : 'var(--daun)';
  return '<div class="kartu"><h2>Kapasitas Spreadsheet</h2>' +
    '<p class="kecil">Google Sheets membatasi <b>10 juta sel</b> per berkas (termasuk sel kosong) dan <b>50.000 karakter</b> per sel. Aplikasi memecah isian panjang (poligon rinci, GeoJSON, foto) ke lembar "Berkas" per 45.000 karakter.</p>' +
    '<div class="baris antara kecil"><span>' + fAngka(k.sel) + ' dari ' + fAngka(k.batas) + ' sel</span><b style="color:' + warna + '">' + fAngka(k.persen, 1) + '%</b></div>' +
    '<div class="batang" style="margin:6px 0 10px"><i style="width:' + Math.min(100, k.persen) + '%;background:' + warna + '"></i></div>' +
    '<div class="tabel-bungkus"><table><thead><tr><th>Lembar</th><th class="n">Baris data</th><th class="n">Sel</th></tr></thead><tbody>' +
    k.lembar.slice(0, 8).map(function (x) { return '<tr><td>' + esc(x.nama) + '</td><td class="n">' + fAngka(x.baris) + '</td><td class="n">' + fAngka(x.sel) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
    (pn.berkasRusak && pn.berkasRusak.length ? '<div class="catatan-kendala" style="margin-top:8px"><b>Rujukan rusak:</b> ' + esc(pn.berkasRusak.map(function (x) { return x.lembar + ' ' + x.kunci + ' (' + x.kolom + ')'; }).join(', ')) + '. Bagian di lembar "Berkas" hilang; pulihkan lewat File ▸ Riwayat versi, atau isi ulang datanya.</div>' : '') +
    '<div class="baris" style="margin-top:10px"><button class="tbl" id="pkRapikan"' + (S.online ? '' : ' disabled') + '>Rapikan penyimpanan</button></div>' +
    '<p class="kecil redup">Merapikan melepas baris/kolom kosong di ujung lembar aplikasi, menghapus bagian berkas yang tidak lagi dirujuk, dan memangkas log ke ' + fAngka(25000) + ' baris terbaru. Isi data tidak diubah. Jangan menyunting lembar "Berkas" secara manual.</p></div>';
}

/* ================= 12-masuk.js : masuk, muat data, mulai ================= */
function tampilkanMasuk(pesan) {
  matikanPeta();
  if (modalTerbuka()) tutupModalLangsung();
  S.data = null;
  var info = S._info || {};
  var h = info.header || {};
  $('#aplikasi').innerHTML = '<div id="layarMasuk"><div class="kotak-masuk">' +
    '<div class="baris" style="margin-bottom:10px"><div style="width:44px;height:44px;border-radius:10px;background:var(--pelepah);display:grid;place-items:center;font-size:24px;overflow:hidden">' + (h.logo ? '<img src="' + esc(h.logo) + '" style="width:100%;height:100%;object-fit:cover" alt="">' : esc(h.ikon || '🌴')) + '</div><div><h1>' + esc(h.judul || 'SawitGIS') + '</h1><div class="kecil redup">' + esc(h.subjudul || 'Perencanaan Replanting Kelapa Sawit') + '</div></div></div>' +
    (pesan ? '<div class="spanduk info" style="border-radius:8px;margin-bottom:10px">' + esc(pesan) + '</div>' : '') +
    (info.lisensi && info.lisensi.status !== 'aktif' && info.lisensi.status !== 'uji' ? '<div class="spanduk waspada" style="border-radius:8px;margin-bottom:10px">' + esc(info.lisensi.ringkas) + '</div>' : '') +
    bentukRuas({ k: 'mEmail', label: 'Surel', t: 'email', ph: 'nama@kebun.co.id' }, bacaLokal('sgis_email_terakhir', '')) +
    bentukRuas({ k: 'mPin', label: 'PIN', t: 'sandi' }) +
    '<button class="tbl utama" id="mMasuk" style="width:100%">Masuk</button>' +
    '<p class="kecil redup" style="margin-top:12px">Lupa PIN? Hubungi admin aplikasi di organisasi Anda. Admin pertama dibuat dari menu Spreadsheet <b>SawitGIS ▸ Buat / Pulihkan Admin</b>.</p>' +
    '<p class="kecil" style="margin:8px 0 0"><button class="tbl-teks" data-legal="syarat">Syarat & ketentuan</button> · <button class="tbl-teks" data-legal="privasi">Privasi</button> · <span class="redup">v' + VERSI_KLIEN + '</span></p>' +
    '</div></div>';
  var e = $('#f_mEmail'), p = $('#f_mPin'), tb = $('#mMasuk');
  e.setAttribute('autocomplete', 'username');
  (e.value ? p : e).focus();
  function kirim() {
    var email = e.value.trim(), pin = p.value;
    if (!email || !pin) return toast('Isi surel dan PIN', true);
    tb.disabled = true; tb.textContent = 'Memeriksa…';
    api('masuk', { email: email, pin: pin }).then(function (r) {
      S.token = r.token; simpanLokal(KUNCI_TOKEN, r.token); simpanLokal('sgis_email_terakhir', email);
      return muatData(true);
    }).catch(function (er) { tb.disabled = false; tb.textContent = 'Masuk'; p.value = ''; galatKeToast(er); });
  }
  tb.onclick = kirim;
  $('#layarMasuk').onclick = function (ev) {
    var l = ev.target.closest('[data-legal]'); if (!l) return;
    bukaModal(l.getAttribute('data-legal') === 'syarat' ? 'Syarat & ketentuan' : 'Privasi', l.getAttribute('data-legal') === 'syarat' ? NASKAH_SYARAT : NASKAH_PRIVASI, { tanpaFokus: true });
  };
}

function pakaiData(d, dariCache) {
  var bobotLama = S.data && S.bobotAktif && !bobotSama(S.bobotAktif, rapikanBobot(S.data.setelan.bobot)) ? S.bobotAktif : null;
  S.data = d; S.dariCache = !!dariCache;
  S.bobotAktif = bobotLama || rapikanBobot(d.setelan.bobot);
  // Catatan luring yang belum terkirim tetap ditampilkan di atas data peladen
  S.antrean.forEach(function (it) { terapkanLokalTanpaHitung(it); });
  hitungUlang();
  var ada = {}; d.blok.forEach(function (b) { if (b.perusahaan) ada['p' + b.perusahaan] = 1; if (b.estate) ada['e' + b.estate] = 1; if (b.divisi) ada['d' + b.divisi] = 1; });
  if (S.saring.perusahaan && !ada['p' + S.saring.perusahaan]) S.saring.perusahaan = '';
  if (S.saring.estate && !ada['e' + S.saring.estate]) S.saring.estate = '';
  if (S.saring.divisi && !ada['d' + S.saring.divisi]) S.saring.divisi = '';
  terapkanTema();
  if (!$('#kepala')) { renderKerangka(); pasangTombolKembaliSekali(); }
  else { renderKerangka(); }
  render();
}
function terapkanLokalTanpaHitung(it) {
  if (!S.data) return;
  if (it.aksi === 'survei_simpan') {
    if (S.data.survei.some(function (x) { return x.idKlien && x.idKlien === it.idKlien && !x._antre; })) return;
    var s = JSON.parse(JSON.stringify(it.data.survei)); s.status = 'TERTUNDA'; s.id = s.id || 'luring-' + s.idKlien; s.dibuatOleh = S.data.saya.email; s._antre = true; s.adaFoto = !!s.foto; delete s.foto;
    S.data.survei = S.data.survei.filter(function (x) { return x.id !== s.id; }); S.data.survei.push(s);
  } else if (it.aksi === 'produksi_simpan') {
    var d = it.data;
    S.data.produksi = S.data.produksi.filter(function (x) { return !(x.blokId === d.blokId && Number(x.tahun) === Number(d.tahun)); });
    S.data.produksi.push({ id: 'luring-' + d.idKlien, blokId: d.blokId, tahun: Number(d.tahun), tonHa: Number(d.tonHa), sumber: d.sumber || '', idKlien: d.idKlien, _antre: true });
  }
}
var _kembaliTerpasang = false;
function pasangTombolKembaliSekali() { if (_kembaliTerpasang) return; _kembaliTerpasang = true; pasangTombolKembali(); }

function muatData(paksa) {
  if (!S.token) { tampilkanMasuk(); return Promise.resolve(); }
  if (paksa && S.data) toast('Memuat data dari peladen…');
  return api('bootstrap', {}).then(function (d) {
    d._disimpan = new Date().toISOString();
    S.online = true;
    // Bila pengguna berganti, antrean milik akun lain tidak boleh terkirim atas nama akun ini
    var pemilik = bacaLokal('sgis_antrean_pemilik', '');
    if (pemilik && pemilik !== d.saya.email && S.antrean.length) {
      simpanLokal('sgis_antrean_' + pemilik.replace(/[^a-z0-9]/gi, '_'), S.antrean);
      S.antrean = []; simpanLokal(KUNCI_ANTREAN, []);
      toast('Ada catatan luring milik ' + pemilik + ' di perangkat ini. Catatan itu disimpan terpisah dan dikirim saat akun tersebut masuk kembali.', true);
    }
    if (!pemilik || pemilik !== d.saya.email) {
      var milikSaya = bacaLokal('sgis_antrean_' + d.saya.email.replace(/[^a-z0-9]/gi, '_'), null);
      if (milikSaya && milikSaya.length) { S.antrean = S.antrean.concat(milikSaya); simpanLokal(KUNCI_ANTREAN, S.antrean); hapusLokal('sgis_antrean_' + d.saya.email.replace(/[^a-z0-9]/gi, '_')); }
    }
    simpanLokal('sgis_antrean_pemilik', d.saya.email);
    pakaiData(d, false);
    simpanCache();
    if (S.antrean.length) sinkronkanAntrean();
  }).catch(function (e) {
    if (e.kode === 'SESI') return;
    if (e.jaringan) {
      S.online = false;
      var c = bacaLokal(KUNCI_DATA, null);
      if (c && c.data) { c.data._disimpan = c.disimpan; if (!S.data) pakaiData(c.data, true); else { S.dariCache = true; renderSpanduk(); } toast('Luring: memakai data tersimpan', true); return; }
      layarGalat('Tidak ada koneksi dan belum ada data tersimpan di perangkat ini. Sambungkan internet lalu coba lagi.');
      return;
    }
    if (S.data) galatKeToast(e); else layarGalat(e.message);
  });
}
function layarGalat(pesan) {
  $('#aplikasi').innerHTML = '<div id="layarMasuk"><div class="kotak-masuk"><h1>Tidak dapat memuat</h1><p>' + esc(pesan) + '</p><div class="baris"><button class="tbl utama" id="gCoba">Coba lagi</button>' + (S.token ? '<button class="tbl" id="gKeluar">Keluar</button>' : '') + '</div></div></div>';
  $('#gCoba').onclick = function () { mulaiAplikasi(); };
  if ($('#gKeluar')) $('#gKeluar').onclick = function () { hapusLokal(KUNCI_TOKEN); S.token = null; tampilkanMasuk(); };
}

function bukaProfil() {
  var s = S.data.saya;
  bukaModal('Akun', '<div class="baris"><div class="avatar" style="width:56px;height:56px;font-size:22px;cursor:default">' + (s.foto && s.foto.indexOf('data:') === 0 ? '<img src="' + esc(s.foto) + '" alt="">' : esc((s.nama || '?').charAt(0).toUpperCase())) + '</div><div><b>' + esc(s.nama) + '</b><br><span class="kecil">' + esc(s.email) + '</span><br><span class="tag">' + esc(s.peran) + '</span> ' + (s.jabatan ? '<span class="kecil redup">' + esc(s.jabatan) + '</span>' : '') + '</div></div>' +
    '<p class="kecil redup" style="margin-top:12px">' + esc(S.data.lisensi.ringkas) + '</p>',
    { tanpaFokus: true, kaki: '<button class="tbl" id="prSetelan">Setelan akun</button><button class="tbl bahaya" id="prKeluar">Keluar</button>' });
  $('#prSetelan').onclick = function () { tutupModal(); S.sub.setelan = 'akun'; if (S.tab !== 'setelan') { S.tab = 'setelan'; dorongTab(); } render(); };
  $('#prKeluar').onclick = function () { tutupModal(); setTimeout(keluar, 50); };
}

function mulaiAplikasi() {
  S.pref = Object.assign(S.pref, bacaLokal(KUNCI_PREF, {}));
  terapkanTema();
  S.antrean = bacaLokal(KUNCI_ANTREAN, []);
  S.token = bacaLokal(KUNCI_TOKEN, null);
  var hash = (location.hash || '').replace('#', '');
  if (TAB.some(function (t) { return t.k === hash; })) S.tab = hash;
  if (!S.token) {
    $('#aplikasi').innerHTML = '<div id="layarMasuk"><div class="kotak-masuk"><p class="redup">Memuat…</p></div></div>';
    return api('info', {}).then(function (i) { S._info = i; if (i.versi) S.versiPeladen = i.versi; }).catch(function () { }).then(function () { tampilkanMasuk(); });
  }
  // Tampilkan data tersimpan lebih dulu agar aplikasi langsung terpakai di lapangan
  var c = bacaLokal(KUNCI_DATA, null);
  if (c && c.data) { c.data._disimpan = c.disimpan; pakaiData(c.data, true); }
  else $('#aplikasi').innerHTML = '<div id="layarMasuk"><div class="kotak-masuk"><p class="redup">Memuat data…</p></div></div>';
  return muatData(false);
}

window.addEventListener('online', function () { S.online = true; if (S.data) { renderSpanduk(); if (S.dariCache) muatData(false); else sinkronkanAntrean(); } });
window.addEventListener('offline', function () { S.online = false; if (S.data) renderSpanduk(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.online && S.antrean.length && S.token) sinkronkanAntrean(); });

if (MODE === 'pwa' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia. Tutup lalu buka kembali aplikasi untuk memakainya.'); });
      });
    }).catch(function () { });
  });
}

pasangEnter();
mulaiAplikasi();

</script>
